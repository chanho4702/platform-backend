plugins {
    id 'java-library'
    alias(libs.plugins.protobuf)
    id 'maven-publish'
}
// CI가 태그 발행 시 -PprotoVersion=x.y.z 로 주입. 로컬 기본은 SNAPSHOT.
version = providers.gradleProperty('protoVersion').getOrElse('0.1.0-SNAPSHOT')
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
repositories { mavenCentral() }

dependencies {
    // grpc-bom을 함께 노출한다 — 소비 서비스의 grpc-netty-shaded·grpc-inprocess가 버전 없이도 stub과 같은 줄에 선다(P-19).
    api platform(libs.grpc.bom)
    api libs.grpc.stub
    api libs.grpc.protobuf
    api libs.protobuf.java
    // 생성 코드의 @jakarta.annotation.Generated
    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    // 생성 코드의 @javax.annotation.Generated (grpc-protoc-gen-grpc-java 1.69.0)
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}

protobuf {
    protoc { artifact = libs.protobuf.protoc.get().toString() }
    plugins {
        grpc { artifact = libs.grpc.protoc.plugin.get().toString() }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/chanho4702/platform-backend')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
