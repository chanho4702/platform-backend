syntax = "proto3";
package platform.wiki.v1;
option java_multiple_files = true;
option java_package = "com.platform.proto.wiki.v1";

// 위키 콘텐츠 조달 계약 v1 (Wave C, proto v0.4.0) — 색인기 전용 내부 API.
//
// 왜 이게 필요한가: EventEnvelope는 본문을 싣지 않는다("무엇이 변했나"만 알린다).
// 그래서 색인기는 PageCreated/PageUpdated를 받은 뒤 본문을 따로 가져와야 한다.
// 사용자 REST(/api/wiki/pages/{id})는 호출자 JWT로 권한을 검사하는데 색인기는
// 사용자가 아니라 시스템 주체라 통과할 토큰이 없다 — 그래서 별도 gRPC 창구를 둔다.
//
// 주의: 이 서비스는 권한을 검사하지 않는다. 내부망에서만 노출한다(호스트 포트 미개방).
service WikiContentService {
  // 색인용 단건 조달.
  //
  // 상태 계약(색인기가 이 구분에 의존한다):
  //   NOT_FOUND           = 대상이 없다 → 색인에서 뺀다(삭제로 간주)
  //   FAILED_PRECONDITION = 대상은 있는데 참조가 깨졌다(예: 스페이스 없는 고아 페이지)
  //                         → 삭제가 아니다. 재시도/DLQ 대상이며 원본 데이터 수리가 필요하다
  //   UNAVAILABLE/DEADLINE_EXCEEDED = 일시 장애 → 재시도
  rpc GetPageContent(GetPageContentRequest) returns (PageContent);
  // 첨부 단건 조달. AttachmentAdded 이벤트에는 파일명·크기·업로더·스페이스 표시명이 없어
  // 색인 문서를 채우려면 따로 물어봐야 한다(전량 스트림을 매 이벤트마다 훑을 수는 없다).
  rpc GetAttachmentMeta(GetAttachmentMetaRequest) returns (AttachmentMeta);
  // 백필용 전량 스트리밍. space_id=0이면 전 스페이스.
  rpc ListPageContents(ListPageContentsRequest) returns (stream PageContent);
  // 첨부 백필. space_id=0이면 전 스페이스.
  rpc ListAttachments(ListAttachmentsRequest) returns (stream AttachmentMeta);

  // 검색 결과 권한 후필터(W18) — 사용자 기준으로 볼 수 있는 페이지만 남긴다.
  // 페이지 제한(page_restriction)의 단일 진실은 wiki가 소유하므로 판정을 wiki에 위임한다.
  rpc FilterVisiblePages(FilterVisiblePagesRequest) returns (FilterVisiblePagesResponse);
}

enum PageType { PAGE_TYPE_UNSPECIFIED = 0; PAGE = 1; FOLDER = 2; }
enum PageStatus { PAGE_STATUS_UNSPECIFIED = 0; DRAFT = 1; PUBLISHED = 2; }

message GetPageContentRequest { int64 page_id = 1; }
message GetAttachmentMetaRequest { int64 attachment_id = 1; }
message ListPageContentsRequest { int64 space_id = 1; }
message ListAttachmentsRequest { int64 space_id = 1; }

// 색인 문서 1건에 필요한 것 전부. 스페이스 표시명(key·name)은 비정규화해서 함께 싣는다 —
// 색인기가 페이지마다 스페이스를 되묻지 않게 하려는 것이고, 그래서 스페이스명이 바뀌면
// SpaceUpdated 이벤트로 색인을 갱신해야 한다.
message PageContent {
  int64 page_id = 1;
  int64 space_id = 2;
  string space_key = 3;
  string space_name = 4;
  int64 parent_id = 5;      // 0 = 루트
  PageType type = 6;
  PageStatus status = 7;
  string title = 8;
  string content = 9;       // 마크다운 원문
  int32 version = 10;
  int64 author_id = 11;     // 최종 수정자
  int64 updated_at = 12;    // epoch millis
  // 라벨(0.10.0) — 검색의 라벨 필터용. 정규화된 소문자 이름이며 순서는 의미 없다.
  // 색인이 페이지마다 라벨을 되묻지 않도록 본문과 함께 싣는다(space_key·space_name과 같은 이유).
  repeated string labels = 13;
}

message AttachmentMeta {
  int64 attachment_id = 1;
  int64 page_id = 2;
  int64 space_id = 3;
  string filename = 4;
  string content_type = 5;
  int64 size_bytes = 6;
  int64 uploaded_by = 7;
  int64 created_at = 8;     // epoch millis
  // 페이지와 같은 이유로 비정규화한다 — 검색 결과를 그리려고 스페이스를 되묻지 않기 위해서다.
  // v0.4.0 발행 뒤 추가된 필드라 뒤 번호를 쓴다(구버전 소비자는 빈 문자열로 읽는다).
  string space_key = 9;
  string space_name = 10;
}

message FilterVisiblePagesRequest {
  int64 user_id = 1;
  repeated int64 page_ids = 2;
}
message FilterVisiblePagesResponse { repeated int64 visible_page_ids = 1; }
