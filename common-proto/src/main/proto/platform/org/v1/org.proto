syntax = "proto3";
package platform.org.v1;
option java_multiple_files = true;
option java_package = "com.platform.proto.org.v1";

// 조직/권한 계약 v1 — breaking change는 v2 패키지 신설로 대응(온프렘 구버전 공존).
service PermissionService {
  // 단건 권한 판정 — 모든 서비스의 인가 2차 방어가 호출
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  // 검색 결과 권한 필터용(Wave C) — 사용자가 접근 가능한 리소스 목록
  rpc ListUserGrants(ListUserGrantsRequest) returns (ListUserGrantsResponse);
  // 내부 전용 — 리소스 생성자 자동 권한 부여용 (예: wiki 스페이스 생성자 → SPACE ADMIN)
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);
  // 내부 전용 — 리소스가 사라졌을 때 그 리소스에 걸린 grant 정리 (없으면 고아 grant가 남는다)
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  // 사용자의 팀 멤버십(W18 페이지 제한의 TEAM 주체 판정용) — 팀 원장은 org가 소유한다
  rpc ListUserTeams(ListUserTeamsRequest) returns (ListUserTeamsResponse);
  // 페이지 제한 저장 전 주체 실재 검증 — 존재하지 않는 사용자·팀으로 잠기는 구성을 막는다
  rpc ValidatePrincipals(ValidatePrincipalsRequest) returns (ValidatePrincipalsResponse);
  // 이름으로 우리 계정을 찾는다(0.15.0) — 이관이 원본 작성자·제한 주체를 짝지을 창구.
  // id를 아는 ValidatePrincipals와 방향이 반대다: 여기는 id를 모르는 쪽에서 물어본다.
  rpc LookupMembers(LookupMembersRequest) returns (LookupMembersResponse);
  // 이름으로 우리 팀을 찾는다(0.15.0) — 원본 그룹 이름을 팀에 짝짓는다.
  rpc LookupTeams(LookupTeamsRequest) returns (LookupTeamsResponse);
}

enum ResourceType { RESOURCE_TYPE_UNSPECIFIED = 0; GLOBAL = 1; SPACE = 2; PROJECT = 3; }
// COMMENT(W23): 보기와 편집 사이. 컨플루언스의 "댓글 추가" 권한 — 보는 사람 모두가 댓글을 달 수
// 있으면 안 되는 스페이스(공지·규정)가 있다. 번호는 추가 순서라 계층 순서가 아니다.
enum Action { ACTION_UNSPECIFIED = 0; VIEW = 1; EDIT = 2; ADMIN = 3; COMMENT = 4; }
// ROLE_ADMIN: 같은 proto 패키지의 Action.ADMIN과 C++ 스코프 충돌 회피(proto3 enum 값은 패키지 스코프)
enum Role { ROLE_UNSPECIFIED = 0; VIEWER = 1; EDITOR = 2; ROLE_ADMIN = 3; COMMENTER = 4; }

message CheckPermissionRequest {
  int64 user_id = 1;           // JWT sub
  ResourceType resource_type = 2;
  string resource_id = 3;      // GLOBAL이면 빈 값
  Action action = 4;
}
message CheckPermissionResponse {
  bool allowed = 1;
  Role effective_role = 2;     // grant 없으면 ROLE_UNSPECIFIED
}

message ListUserGrantsRequest {
  int64 user_id = 1;
  ResourceType resource_type = 2;  // UNSPECIFIED면 전체
}
message ListUserGrantsResponse { repeated Grant grants = 1; }
message Grant {
  ResourceType resource_type = 1;
  string resource_id = 2;
  Role role = 3;
}

message CreateGrantRequest {
  int64 user_id = 1;
  ResourceType resource_type = 2;
  string resource_id = 3;      // GLOBAL이면 빈 값으로 정규화됨
  Role role = 4;
}
message CreateGrantResponse { bool created = 1; }  // 동일 grant 존재 시 false (멱등)

message RevokeGrantRequest {
  ResourceType resource_type = 1;
  string resource_id = 2;      // GLOBAL이면 빈 값으로 정규화됨
  // 0이면 해당 리소스의 grant 전부 회수(리소스 삭제 시). 지정하면 그 사용자 것만.
  int64 user_id = 3;
}
message RevokeGrantResponse { int32 revoked = 1; }  // 회수한 grant 수 — 대상이 없으면 0 (멱등)

message ListUserTeamsRequest { int64 user_id = 1; }
message ListUserTeamsResponse { repeated int64 team_ids = 1; }

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_USER = 1;
  PRINCIPAL_TEAM = 2;
}
message PrincipalRef {
  PrincipalKind kind = 1;
  int64 id = 2;
}
message ValidatePrincipalsRequest { repeated PrincipalRef principals = 1; }
// 요청 순서와 무관하게, 실재하지 않거나 형식이 잘못된 주체만 반환한다.
message ValidatePrincipalsResponse { repeated PrincipalRef missing = 1; }

// ── 이름 조회(0.15.0) ─────────────────────────────────────────────
// 대조는 trim + 대소문자 무시다. 한 질의에 활성 멤버가 둘 이상 걸리면 **매칭으로 세지 않는다** —
// 누구인지 모르는 채로 하나를 고르면 이관이 남의 이름으로 문서를 쓴다(fail-closed).
// 요청 항목 수 상한은 200이다(emails + usernames 합, names 각각). 넘으면 INVALID_ARGUMENT.

message LookupMembersRequest {
  repeated string emails = 1;
  // 원본이 이메일을 안 주는 경우의 차선. org에는 username 컬럼이 없어 **이메일 local-part**로 본다.
  repeated string usernames = 2;
}
// 매칭된 것만 담는다. query는 요청에 실렸던 문자열 그대로라 호출측이 바로 되짚을 수 있다.
message MemberMatch {
  string query = 1;
  int64 member_id = 2;
  string display_name = 3;
  string email = 4;
}
message LookupMembersResponse { repeated MemberMatch matches = 1; }

message LookupTeamsRequest { repeated string names = 1; }
message TeamMatch {
  string query = 1;
  int64 team_id = 2;
  string name = 3;
}
message LookupTeamsResponse { repeated TeamMatch matches = 1; }
