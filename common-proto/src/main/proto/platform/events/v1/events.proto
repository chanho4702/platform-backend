syntax = "proto3";
package platform.events.v1;
option java_multiple_files = true;
option java_package = "com.platform.proto.events.v1";

// 모든 도메인 이벤트의 공통 봉투. Redis Stream(platform:events:v1) 엔트리의 payload 필드에 바이너리로 실린다.
// 본문(content)은 싣지 않는다 — 소비자는 "무엇이 변했나"만 알고, 내용은 소유 서비스 API로 가져간다.
message EventEnvelope {
  string event_id = 1;        // UUID — 소비자 멱등 처리용
  int64 occurred_at = 2;      // epoch millis
  int64 actor_id = 3;         // 행위자 (auth user id)
  string source = 4;          // 발행 서비스명 (예: "wiki-backend")
  oneof payload {
    SpaceCreated space_created = 10;
    SpaceDeleted space_deleted = 11;
    PageCreated page_created = 12;
    PageUpdated page_updated = 13;
    PageDeleted page_deleted = 14;
    AttachmentAdded attachment_added = 15;
    // v0.3.0 추가 — 10~15는 v0.2.0에서 이미 발행돼 번호를 재사용하지 않는다
    SpaceUpdated space_updated = 16;
    AttachmentDeleted attachment_deleted = 17;
    // Wave D — ALM 프로젝트·이슈. 18~19는 향후 wiki v1 보강을 위해 비워 둔다.
    ProjectCreated project_created = 20;
    ProjectUpdated project_updated = 21;
    ProjectDeleted project_deleted = 22;
    IssueCreated issue_created = 23;
    IssueUpdated issue_updated = 24;
    IssueDeleted issue_deleted = 25;
  }
}

message SpaceCreated { int64 space_id = 1; string key = 2; string name = 3; }
// 이름·설명이 바뀌면 색인의 스페이스 표시명이 스테일해진다 — 그래서 갱신도 이벤트로 나간다.
message SpaceUpdated { int64 space_id = 1; string key = 2; string name = 3; }
message SpaceDeleted { int64 space_id = 1; }
message PageCreated  { int64 page_id = 1; int64 space_id = 2; string title = 3; }
message PageUpdated  { int64 page_id = 1; int64 space_id = 2; string title = 3; int32 version = 4; }
message PageDeleted  { int64 page_id = 1; int64 space_id = 2; }
message AttachmentAdded { int64 attachment_id = 1; int64 page_id = 2; int64 space_id = 3; string filename = 4; }
// 첨부가 사라졌는데 색인에 남으면 검색 결과에서 404로 이어진다.
message AttachmentDeleted { int64 attachment_id = 1; int64 page_id = 2; int64 space_id = 3; }

message ProjectCreated { int64 project_id = 1; string key = 2; string name = 3; }
message ProjectUpdated { int64 project_id = 1; string key = 2; string name = 3; }
message ProjectDeleted { int64 project_id = 1; }
message IssueCreated { int64 issue_id = 1; int64 project_id = 2; string issue_key = 3; string title = 4; }
message IssueUpdated { int64 issue_id = 1; int64 project_id = 2; string issue_key = 3; string title = 4; int32 version = 5; }
message IssueDeleted { int64 issue_id = 1; int64 project_id = 2; string issue_key = 3; }
