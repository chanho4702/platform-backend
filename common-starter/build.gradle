plugins {
    id 'java-library'
    id 'maven-publish'
}
// CI가 태그 발행 시 -PstarterVersion=x.y.z 로 주입(common-proto와 같은 태그·같은 버전). 로컬 기본은 SNAPSHOT.
version = providers.gradleProperty('starterVersion').getOrElse('0.1.0-SNAPSHOT')
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
repositories { mavenCentral() }

def bootVersion = '4.0.6'

dependencies {
    // 소비 서비스가 이미 들고 있는 스타터에 기대고, 여기서는 버전을 강제하지 않는다(compileOnly).
    compileOnly platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/chanho4702/platform-backend')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
