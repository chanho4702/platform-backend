plugins {
    id 'java-library'
    id 'maven-publish'
}
// CI가 태그 발행 시 -PstarterVersion=x.y.z 로 주입(common-proto와 같은 태그·같은 버전). 로컬 기본은 SNAPSHOT.
version = providers.gradleProperty('starterVersion').getOrElse('0.1.0-SNAPSHOT')
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
repositories { mavenCentral() }

def bootVersion = '4.0.6'

dependencies {
    // 소비 서비스가 이미 들고 있는 스타터에 기대고, 여기서는 버전을 강제하지 않는다(compileOnly).
    compileOnly platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    // 낙관적 락 실패(org.springframework.dao) → 409. JPA를 안 쓰는 서비스도 있어 조건부 등록한다.
    compileOnly 'org.springframework:spring-tx'
    // 서비스 간 gRPC 인증 인터셉터(P-01). gRPC가 classpath에 있는 서비스에서만 자동 구성이 켜진다.
    compileOnly platform(libs.grpc.bom)
    compileOnly libs.grpc.api
    // /error 컨트롤러를 OpenAPI 문서에서 숨기는 @Hidden 하나만 쓴다. springdoc을 쓰는 서비스(org·wiki·alm·migration)에는
    // 런타임에 이미 있고, 없는 서비스에서는 클래스의 어노테이션이 조용히 무시된다(어노테이션은 링크 실패를 내지 않는다).
    // 버전은 springdoc 3.0.3이 끌어오는 값과 같게 둔다.
    compileOnly 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.47'

    testImplementation platform("org.springframework.boot:spring-boot-dependencies:${bootVersion}")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.springframework:spring-orm'
    testImplementation project(':common-proto')
    testImplementation libs.grpc.inprocess
    // /error가 OpenAPI 스펙에 나오지 않는지 실제 springdoc으로 확인한다(PlatformErrorControllerOpenApiTest).
    testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/chanho4702/platform-backend')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
