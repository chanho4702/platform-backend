spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/.well-known/jwks.json
  # 테스트 컨텍스트는 실 Redis에 붙지 않는다 — 소비 경로 검증은 Testcontainers로 별도 수행
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

eureka:
  client:
    enabled: false

platform:
  jwt:
    issuer: http://localhost:9000
    audience: platform-api
  org-grpc:
    host: localhost
    port: 9131
  wiki-grpc:
    host: localhost
    port: 9111
  opensearch:
    uri: http://localhost:9200
    # 일반 컨텍스트 테스트는 외부 프로세스를 요구하지 않는다. 실제 부트스트랩은 전용
    # Testcontainers 테스트가 nori 포함 OpenSearch에 두 번 실행해 검증한다.
    bootstrap:
      enabled: false
  events:
    enabled: false   # 실 스트림 소비 비활성 — 소비 경로는 Testcontainers 테스트가 직접 켠다
