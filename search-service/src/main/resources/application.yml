server:
  port: 9140
spring:
  application:
    name: search-service
  # RDB 없음 — 색인은 OpenSearch가 소유하고 원본은 wiki-backend가 소유한다.
  # 재색인으로 언제든 복구되는 파생 데이터뿐이라 별도 DB를 두지 않는다(설계 §2).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
  graphql:
    path: /graphql
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/.well-known/jwks.json}

# Actuator — 내부 네트워크 전용이다(게이트웨이 라우트는 /api·/graphql뿐, nginx도 /actuator를 넘기지 않는다).
# health와 info 둘만. info의 build.version을 헬스 집계 표의 "버전" 열이 읽는다.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    build:
      enabled: true
  health:
    eureka:
      enabled: false         # 유레카는 대시보드가 따로 본다

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

platform:
  jwt:
    issuer: ${PLATFORM_ISSUER:http://localhost:9000}
    audience: ${PLATFORM_AUDIENCE:platform-api}
  # 권한 필터용 — org 불능 시 SERVICE_UNAVAILABLE(httpStatus=503) GraphQL 오류 전파. 설계 §7
  org-grpc:
    host: ${ORG_GRPC_HOST:localhost}
    port: ${ORG_GRPC_PORT:9131}
  # 본문·첨부 조달용 — 색인기 전용 내부 API(proto v0.5.0 wiki.v1)
  wiki-grpc:
    host: ${WIKI_GRPC_HOST:localhost}
    port: ${WIKI_GRPC_PORT:9111}
  opensearch:
    uri: ${OPENSEARCH_URI:http://localhost:9200}
  events:
    # Redis Streams 소비 — wiki-backend가 발행하는 스트림과 같은 키여야 한다
    stream: ${EVENTS_STREAM:platform:events:v1}
    consumer-group: search-service
    enabled: ${EVENTS_ENABLED:true}
    # 처리 실패 재시도 상한. 넘으면 DLQ로 옮기고 ERROR 로그(설계 §6)
    max-retries: ${EVENTS_MAX_RETRIES:5}
    dlq: ${EVENTS_DLQ:platform:events:v1:dlq}

---
# 배포판(compose): Eureka 미등록 — 게이트웨이는 SEARCH_SERVICE_URI(DNS 직결)로 라우팅
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    enabled: false
logging:
  # 컨테이너에서는 구조화 필드를 stdout JSON으로 내고 Alloy가 수집한다. 앱에서 Loki에 직결하지 않는다.
  structured:
    format:
      console: ecs
