plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}
// 이미지 버전 스탬프 — CI가 -PappVersion=<짧은sha>-<YYYYMMDD>로 주입한다.
// /actuator/info의 build.version이 이 값이 되고, 관리자 대시보드 "버전" 열이 그걸 읽는다.
// 이름을 appVersion으로 둔 이유: -Pversion은 Gradle 내장 project.version과 겹쳐 이 줄이 덮어써 버린다.
version = providers.gradleProperty('appVersion').getOrElse('0.0.1-SNAPSHOT')
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
repositories { mavenCentral() }

ext { set('springCloudVersion', '2025.1.2') }
ext { set('testcontainersVersion', '1.21.3') }
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        // Boot 4 BOM이 testcontainers 버전을 관리하지 않아 직접 가져온다(wiki-backend와 동일)
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

def grpcVersion = '1.69.0'
// OpenSearch 클라이언트 — 엔진은 Apache 2.0 OpenSearch 2.x (기획 확정).
// ES 클라이언트가 아니라 opensearch-java를 쓴다: ES 8 클라이언트는 헤더 검사로 OpenSearch 접속을 거부한다.
def openSearchVersion = '2.19.0'

dependencies {
    // 같은 멀티모듈이라 GitHub Packages 발행본이 아니라 프로젝트 의존으로 쓴다 —
    // proto를 고칠 때마다 발행하지 않아도 되고, 버전 어긋남이 원천적으로 생기지 않는다.
    implementation project(':common-proto')
    implementation project(':common-starter')
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // health·info 노출 — 헬스 집계가 다른 서비스에 요구하는 것과 같은 계약(build.version 포함).
    // 그전까지는 actuator가 없어 HealthCatalog가 루트(/) 폴백으로 살아있음만 봤고 버전 열이 비었다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "org.opensearch.client:opensearch-java:${openSearchVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.graphql:spring-graphql-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    // 색인·소비 경로는 페이크로 검증하면 안 된다 — wiki-backend의 RedisStreamEventPublisher가
    // 어떤 테스트도 실행한 적 없어 12일간 이벤트가 유실됐던 사고(08-02)의 재발 방지.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.awaitility:awaitility'
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('bootJar') { archiveFileName = 'app.jar' }

// /actuator/info의 build.version — 헬스 집계 표의 "버전" 열이 이 값을 읽는다.
springBoot { buildInfo() }
