plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}
// 이미지 버전 스탬프 — CI가 -PappVersion=<짧은sha>-<YYYYMMDD>로 주입한다.
// /actuator/info의 build.version이 이 값이 되고, 관리자 대시보드 "버전" 열이 그걸 읽는다.
// 이름을 appVersion으로 둔 이유: -Pversion은 Gradle 내장 project.version과 겹쳐 이 줄이 덮어써 버린다.
version = providers.gradleProperty('appVersion').getOrElse('0.0.1-SNAPSHOT')
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
repositories { mavenCentral() }

ext { set('springCloudVersion', '2025.1.2') }
dependencyManagement {
    imports { mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}" }
}

def grpcVersion = '1.69.0'

dependencies {
    implementation project(':common-proto')
    implementation project(':common-starter')
    // 유레카 자기등록 — dev 모드에서 게이트웨이 lb://org-service가 이 등록을 바라본다 (docker 프로필은 off)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 헬스·빌드 정보만 낸다(management.endpoints.web.exposure.include). 게이트웨이 상태판이 읽는 내부 표면.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // OpenAPI 3 스펙(JSON)만 — swagger-ui는 붙이지 않는다(공개 문서는 myFront /docs/가 낸다).
    // springdoc 3.0.x가 Boot 4.0.x 라인이다(3.0.3은 Boot 4.0.5 기준으로 빌드됐다). 3.1.0은 Boot 4.1 라인이라 쓰지 않는다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.3'
    // 플랫폼 메일 허브(M1) — 발송은 이 서비스 한 곳에서만 한다(wiki·alm은 /internal/org/mail로 넘긴다).
    // JavaMailSender는 spring.mail.* 자동설정이 아니라 mail_setting 행에서 런타임에 조립한다.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}"   // 리플렉션(grpcurl 디버깅용)
    // 관리자 통계 60초 캐시 — 대시보드를 여럿이 봐도 질의는 분당 한 묶음이다
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // 아바타 바이트 저장소(MinIO/S3 호환). 기본은 로컬 파일이라 dev에서는 쓰이지 않는다
    implementation platform('software.amazon.awssdk:bom:2.49.6')
    implementation 'software.amazon.awssdk:s3'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
    testRuntimeOnly 'com.h2database:h2'
}
// /actuator/info의 build.version — 게이트웨이 상태판이 서비스 버전을 여기서 읽는다
springBoot { buildInfo() }

tasks.named('test') { useJUnitPlatform() }
tasks.named('bootJar') { archiveFileName = 'app.jar' }
