server:
  port: 9130
spring:
  application:
    name: org-service
  # 모든 자격증명/URL은 env로 오버라이드 가능. 기본값은 로컬 dev 전용.
  datasource:
    url: ${ORG_DB_URL:jdbc:postgresql://localhost:5433/orgdb}
    username: ${ORG_DB_USERNAME:keycloak}
    password: ${ORG_DB_PASSWORD:keycloak}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # 아바타 상한(2MB)은 서비스가 판정해 한국어 400을 돌려준다 — 컨테이너 상한을 그보다
      # 넉넉히 두어야 사용자가 원인 모를 오류 대신 안내 문구를 본다.
      max-file-size: ${ORG_MAX_AVATAR_MB:4}MB
      max-request-size: ${ORG_MAX_AVATAR_MB:4}MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/.well-known/jwks.json}

# OpenAPI 스펙(JSON) — UI 없음. /internal/org/**·액추에이터가 문서에 새지 않도록 공개 API 경로만 담는다.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
  paths-to-match: /api/org/**
  # @RestControllerAdvice가 다루는 예외를 전부 모든 오퍼레이션의 응답으로 베끼지 않는다 —
  # 그러면 목록 조회에도 404·409·503이 붙어 "이 엔드포인트가 실제로 내는 코드"라는 뜻이 사라진다.
  # 공통 오류는 OpenApiConfig의 OperationCustomizer가 붙이고, 사유가 제각각인 409는 @ConflictResponse를 붙인 곳에만 들어간다.
  override-with-generic-response: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    # DNS 해석 불가 호스트명 등록 방지 — 게이트웨이 lb:// 해석 사고 예방 (기존 서비스 실측 패턴)
    prefer-ip-address: true

platform:
  jwt:
    issuer: ${PLATFORM_ISSUER:http://localhost:9000}
    audience: ${PLATFORM_AUDIENCE:platform-api}
  grpc:
    port: ${ORG_GRPC_PORT:9131}
    enabled: true
  # 최초 GLOBAL ADMIN 부트스트랩 — auth-server user id. 빈 값이면 시드 생략.
  bootstrap-admin-id: ${PLATFORM_BOOTSTRAP_ADMIN_ID:}
  org:
    # 서비스 간 전용 경로(/internal/org/**)의 토큰. 비어 있으면 내부 API 전체가 403이다(fail-closed).
    internal-token: ${ORG_INTERNAL_TOKEN:}
    invitation:
      # 초대 유효기간(ISO-8601 기간). 기본 7일.
      ttl: ${ORG_INVITATION_TTL:P7D}
      # 초대 링크의 호스트(예: https://platform.example.com). 경로는 auth-server의 /invite/{token}.
      # 비우면 상대 경로(/invite/...)로 내려가고 화면이 자기 오리진을 붙인다.
      #
      # 이 값은 env 키가 둘이다: 아래 플레이스홀더의 ORG_INVITATION_BASE_URL과, 프로퍼티 경로를
      # 그대로 대문자로 옮긴 PLATFORM_ORG_INVITATION_BASE_URL(Spring 완화 바인딩). 후자가 이긴다 —
      # systemEnvironment가 application.yml보다 우선순위가 높다(2026-09-05 실측). compose는 후자를 쓴다.
      base-url: ${ORG_INVITATION_BASE_URL:}
      # 토큰 없이 이메일 대조만으로 초대를 소진해도 되는 로그인 경로(콤마 구분).
      # 구글 IdP는 trustEmail이라 이메일이 검증된 값이다 — 비밀번호 가입은 링크 경유만 인정한다.
      email-match-providers: ${ORG_INVITATION_EMAIL_MATCH_PROVIDERS:GOOGLE}
      # 리소스(SPACE/PROJECT) ADMIN의 초대 허용. 조직 정책상 전역 관리자만이면 false.
      resource-admin-enabled: ${ORG_INVITATION_RESOURCE_ADMIN:true}
      expiry-cron: ${ORG_INVITATION_EXPIRY_CRON:0 */10 * * * *}
    mail:
      # 미설정(host 비어 있음)이면 메일을 보내지 않고 화면이 초대 링크 복사로 안내한다.
      host: ${PLATFORM_MAIL_HOST:}
      port: ${PLATFORM_MAIL_PORT:587}
      username: ${PLATFORM_MAIL_USERNAME:}
      password: ${PLATFORM_MAIL_PASSWORD:}
      from: ${PLATFORM_MAIL_FROM:}
    keycloak:
      # 계정 비활성/활성(Admin REST). 시크릿이 없으면 no-op이고 member_event에만 흔적이 남는다.
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      admin-client-id: ${KC_ADMIN_CLIENT_ID:platform-admin}
      admin-client-secret: ${KC_ADMIN_CLIENT_SECRET:}
    avatar:
      # 기본은 로컬 파일 — dev 오프셋 클러스터는 MinIO 없이 뜬다. 운영 compose가 s3.enabled를 켠다.
      files-dir: ${ORG_FILES_DIR:./data/avatars}
      s3:
        enabled: ${ORG_S3_ENABLED:false}
        bucket: ${ORG_S3_BUCKET:member-avatars}
        region: ${ORG_S3_REGION:us-east-1}
        endpoint: ${ORG_S3_ENDPOINT:}
        path-style-access: ${ORG_S3_PATH_STYLE_ACCESS:true}
        access-key: ${ORG_S3_ACCESS_KEY:}
        secret-key: ${ORG_S3_SECRET_KEY:}

---
# 배포판(compose): Eureka 미등록 — 게이트웨이는 ORG_SERVICE_URI(DNS 직결)로 라우팅 (15번 문서 확정)
spring:
  config:
    activate:
      on-profile: docker
eureka:
  client:
    enabled: false
