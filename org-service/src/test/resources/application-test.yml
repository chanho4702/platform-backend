spring:
  datasource:
    url: jdbc:h2:mem:orgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/.well-known/jwks.json

eureka:
  client:
    enabled: false

platform:
  jwt:
    issuer: http://localhost:9000
    audience: platform-api
  grpc:
    enabled: false   # 단위 테스트에서 실포트 열지 않음 — gRPC는 in-process로 검증
  bootstrap-admin-id: ""
  org:
    # 서비스 간 경로(/internal/org/**) 테스트용 — 배포에서는 ORG_INTERNAL_TOKEN으로 주입한다
    internal-token: test-internal-token
    invitation:
      base-url: https://platform.test
      # 스케줄러가 테스트 중에 끼어들지 않게 먼 시각으로 둔다(만료는 서비스 호출로 직접 검증)
      expiry-cron: "0 0 3 1 1 *"
    mail:
      # 테스트는 워커가 스스로 돌지 않게 한다 — 재시도·백오프는 drainOnce()를 직접 불러 검증한다.
      # (그러지 않으면 5초 폴링이 테스트 중간에 끼어들어 시도 횟수가 흔들린다.)
      outbox:
        poll-ms: 3600000
        cleanup-cron: "0 0 3 1 1 *"
    avatar:
      files-dir: build/test-avatars
      s3:
        enabled: false
